name: Build
on:
  push:
    branches:
    - main
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - closed
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - name: Check out
      uses: actions/checkout@v5
    - name: Setup .Net
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.x
    - name: Start SQL Server (Docker)
      run: docker run -d --name ci-sql-server -e "ACCEPT_EULA=Y" -e "MSSQL_SA_PASSWORD=P@ssw0rd_CI_Only!" -p 1433:1433 mcr.microsoft.com/mssql/server:2022-latest
    - name: Wait for SQL Server to be ready
      run: >-
        for i in {1..30}; do
          if docker exec ci-sql-server /opt/mssql-tools18/bin/sqlcmd \
              -C -S localhost -U sa -P "P@ssw0rd_CI_Only!" -Q "SELECT 1" > /dev/null 2>&1; then
            echo "SQL Server is ready"
            exit 0
          fi
          echo "Waiting for SQL Server... ($i)"
          sleep 2
        done

        echo "::error::SQL Server did not become ready in time"

        exit 1
      shell: bash
    - name: Restore
      run: dotnet restore LondonFhirService.CI.slnf
    - name: Build
      run: dotnet build LondonFhirService.CI.slnf --no-restore
    - name: Install EF Tools
      run: dotnet tool install --global dotnet-ef
    - name: Point CI database connections at Dockerized SQL Server
      env:
        CI_SQL_SERVER_PASSWORD: P@ssw0rd_CI_Only!
      run: >-
        $files = Get-ChildItem -Path . -Filter "appsettings.json" -Recurse

        foreach ($file in $files) {
          $content = Get-Content $file.FullName -Raw
          if ($content -match "LondonFhirServiceConnectionString") {
            $updated = $content `
              -replace [regex]::Escape('Server=(localdb)\MSSQLLocalDB;'), 'Server=localhost,1433;' `
              -replace [regex]::Escape('Trusted_Connection=True;'), "User Id=sa;Password=$env:CI_SQL_SERVER_PASSWORD;TrustServerCertificate=True;"
            Set-Content -Path $file.FullName -Value $updated
            Write-Host "Patched connection string in $($file.FullName)"
          }
        }
      shell: pwsh
    - name: Deploy Database
      env:
        ConnectionStrings__LondonFhirServiceConnectionString: Server=localhost,1433;Database=LondonFhirService;User Id=sa;Password=P@ssw0rd_CI_Only!;TrustServerCertificate=True;MultipleActiveResultSets=true
      run: dotnet ef database update --project LondonFhirService.Core/LondonFhirService.Core.csproj --startup-project LondonFhirService.Core/LondonFhirService.Core.csproj
    - name: Run Unit Tests
      run: >-
        $projects = Get-ChildItem -Path . -Filter "*Tests.Unit*.csproj" -Recurse

        $failed = @()

        foreach ($project in $projects) {
          Write-Host "Running tests for: $($project.FullName)"
          dotnet test $project.FullName --no-build --verbosity normal
          if ($LASTEXITCODE -ne 0) { $failed += $project.Name }
        }

        if ($failed.Count -gt 0) {
          Write-Host "::error::Test projects failed: $($failed -join ', ')"
          exit 1
        }
      shell: pwsh
    - name: Run Acceptance Tests
      run: >-
        $projects = Get-ChildItem -Path . -Filter "*Tests.Acceptance*.csproj" -Recurse

        $failed = @()

        foreach ($project in $projects) {
          Write-Host "Running tests for: $($project.FullName)"
          dotnet test $project.FullName --no-build --verbosity normal
          if ($LASTEXITCODE -ne 0) { $failed += $project.Name }
        }

        if ($failed.Count -gt 0) {
          Write-Host "::error::Test projects failed: $($failed -join ', ')"
          exit 1
        }
      shell: pwsh
    env:
      NOTIFICATIONCONFIGURATIONS__APIKEY: ${{ secrets.NOTIFICATIONCONFIGURATIONS__APIKEY }}
  add_tag:
    name: Tag and Release
    runs-on: ubuntu-latest
    needs:
    - build
    if: >-
      needs.build.result == 'success' && 

      github.event.pull_request.merged && 

      github.event.pull_request.base.ref == 'main' && 

      startsWith(github.event.pull_request.title, 'RELEASES:') && 

      contains(github.event.pull_request.labels.*.name, 'RELEASES')
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        token: ${{ secrets.PAT_FOR_TAGGING }}
    - name: Configure Git
      run: >-
        git config user.name "GitHub Action"

        git config user.email "action@github.com"
    - name: Extract Version
      id: extract_version
      run: >
        # Running on Linux/Unix 

        sudo apt-get install xmlstarlet

        version_number=$(xmlstarlet sel -t -v "//Version" -n LondonFhirService.Core/LondonFhirService.Core.csproj)

        echo "$version_number"

        echo "version_number<<EOF" >> $GITHUB_OUTPUT 

        echo "$version_number" >> $GITHUB_OUTPUT 

        echo "EOF" >> $GITHUB_OUTPUT 
      shell: bash
    - name: Display Version
      run: 'echo "Version number: ${{ steps.extract_version.outputs.version_number }}"'
    - name: Extract Package Release Notes
      id: extract_package_release_notes
      run: >
        # Running on Linux/Unix 

        sudo apt-get install xmlstarlet

        package_release_notes=$(xmlstarlet sel -t -v "//PackageReleaseNotes" -n LondonFhirService.Core/LondonFhirService.Core.csproj)

        echo "$package_release_notes"

        echo "package_release_notes<<EOF" >> $GITHUB_OUTPUT 

        echo "$package_release_notes" >> $GITHUB_OUTPUT 

        echo "EOF" >> $GITHUB_OUTPUT 
      shell: bash
    - name: Display Package Release Notes
      run: 'echo "Package Release Notes: ${{ steps.extract_package_release_notes.outputs.package_release_notes }}"'
    - name: Create GitHub Tag
      run: >-
        git tag -a "v${{ steps.extract_version.outputs.version_number }}" -m "Release - v${{ steps.extract_version.outputs.version_number }}"

        git push origin --tags
    - name: Create GitHub Release
      uses: actions/create-release@v1
      with:
        tag_name: v${{ steps.extract_version.outputs.version_number }}
        release_name: Release - v${{ steps.extract_version.outputs.version_number }}
        body: >-
          ## Release - v${{ steps.extract_version.outputs.version_number }}


          ### Release Notes

          ${{ steps.extract_package_release_notes.outputs.package_release_notes }}
      env:
        GITHUB_TOKEN: ${{ secrets.PAT_FOR_TAGGING }}
