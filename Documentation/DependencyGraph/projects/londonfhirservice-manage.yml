# LondonFhirService.Manage — components and flows
# Part of the solution dependency graph — see README.md in this folder.
# Data only: index.html fetches graph.yml, then each project file, and
# assembles them. Strings with special characters are double-quoted JSON.

project: manage
components:
  - id: MG.Audits
    name: AuditsController
    layer: exposer
    col: 4
    description: "RESTFulController over Audit, [Authorize(Roles = ManageRoles.Administrators)] - administrators only, because an audit row carries a whole patient payload. The list endpoint is OData-enabled ([EnableQuery], PageSize 5000 in DEBUG and 50 otherwise) and returns the IQueryable straight from the foundation service, and the entity is registered in the host's EDM model so it is reachable on /odata as well as /api. Xeption types are mapped one-for-one onto RFC problem responses. Create, update and delete carry [InvisibleApi]: the middleware on this host makes them unroutable without the key header, so they answer 404 to anyone who does not hold it."
    methods:
      - POST /api/Audits
      - GET /api/Audits
      - "GET /api/Audits/{auditId}"
      - PUT /api/Audits
      - "DELETE /api/Audits/{auditId}"
    calls:
      - from: POST /api/Audits
        to: FS.Audit
        method: AddAuditAsync(audit)
      - from: GET /api/Audits
        to: FS.Audit
        method: RetrieveAllAuditsAsync
      - from: "GET /api/Audits/{auditId}"
        to: FS.Audit
        method: RetrieveAuditByIdAsync
      - from: PUT /api/Audits
        to: FS.Audit
        method: ModifyAuditAsync
      - from: "DELETE /api/Audits/{auditId}"
        to: FS.Audit
        method: RemoveAuditByIdAsync
  - id: MG.Metrics
    name: MetricsController
    layer: exposer
    col: 4
    description: "RESTFulController over Metric, [Authorize(Roles = ManageRoles.AdministratorsAndUsers)]. The list endpoint is OData-enabled ([EnableQuery], PageSize 5000 in DEBUG and 50 otherwise) and returns the IQueryable straight from the foundation service, and the entity is registered in the host's EDM model so it is reachable on /odata as well as /api. Xeption types are mapped one-for-one onto RFC problem responses. Create, update and delete carry [InvisibleApi]: the middleware on this host makes them unroutable without the key header, so they answer 404 to anyone who does not hold it. There is no PUT — a metric records work that already happened, so the table is append-only and no update path exists beneath the controller to expose. GET /api/Metrics/exports is the one route that is not a foundation passthrough: it hands the list's filter (optional correlationId and userId, fromDate / toDate inclusive) to MetricOrchestrationService and returns every matching request, unpaged, as File(stream, text/csv, metrics.csv). It is a literal segment, so it is matched ahead of the {metricId} route, and it is not [InvisibleApi] — the export is a portal feature."
    methods:
      - POST /api/Metrics
      - GET /api/Metrics
      - GET /api/Metrics/exports
      - "GET /api/Metrics/{metricId}"
      - "DELETE /api/Metrics/{metricId}"
    calls:
      - from: POST /api/Metrics
        to: FS.Metric
        method: AddMetricAsync
      - from: GET /api/Metrics
        to: FS.Metric
        method: RetrieveAllMetricsAsync
      - from: GET /api/Metrics/exports
        to: OR.Metric
        method: ExportRequestMetricsToCsvAsync
      - from: "GET /api/Metrics/{metricId}"
        to: FS.Metric
        method: RetrieveMetricByIdAsync
      - from: "DELETE /api/Metrics/{metricId}"
        to: FS.Metric
        method: RemoveMetricByIdAsync
  - id: MG.Providers
    name: ProvidersController
    layer: exposer
    col: 4
    description: "RESTFulController over Provider, [Authorize(Roles = ManageRoles.AdministratorsAndUsers)]. The list endpoint is OData-enabled ([EnableQuery], PageSize 5000 in DEBUG and 50 otherwise) and returns the IQueryable straight from the foundation service, and the entity is registered in the host's EDM model so it is reachable on /odata as well as /api. Xeption types are mapped one-for-one onto RFC problem responses. Reads are open to Administrators and Users; create, update and delete narrow to Administrators with a second [Authorize] on the method, because a provider row decides who the patient fan-out calls and which source is primary. Nothing here is [InvisibleApi] — providers are configuration an operator manages, not a record only the acceptance suite should seed."
    methods:
      - POST /api/Providers
      - GET /api/Providers
      - "GET /api/Providers/{providerId}"
      - PUT /api/Providers
      - "DELETE /api/Providers/{providerId}"
    calls:
      - from: POST /api/Providers
        to: FS.Provider
        method: AddProviderAsync
      - from: GET /api/Providers
        to: FS.Provider
        method: RetrieveAllProvidersAsync
      - from: "GET /api/Providers/{providerId}"
        to: FS.Provider
        method: RetrieveProviderByIdAsync
      - from: PUT /api/Providers
        to: FS.Provider
        method: ModifyProviderAsync
      - from: "DELETE /api/Providers/{providerId}"
        to: FS.Provider
        method: RemoveProviderByIdAsync
  - id: MG.FhirRecords
    name: FhirRecordsController
    layer: exposer
    col: 4
    description: "RESTFulController over FhirRecord. Every verb carries its own [Authorize], each one ManageRoles.AdministratorsAndUsers widened with a granular app role (FhirRecords.Read / Create / Update / Delete) — so the two portal roles still pass and a caller holding only the granular role passes too. The [InvisibleApi] attributes are commented out rather than absent: the comparison screens read these rows, so the verbs have to be routable. The list endpoint is OData-enabled ([EnableQuery], PageSize 5000 in DEBUG and 50 otherwise) and returns the IQueryable straight from the foundation service, and the entity is registered in the host's EDM model so it is reachable on /odata as well as /api. Xeption types are mapped one-for-one onto RFC problem responses."
    methods:
      - POST /api/FhirRecords
      - GET /api/FhirRecords
      - "GET /api/FhirRecords/{fhirRecordId}"
      - PUT /api/FhirRecords
      - "DELETE /api/FhirRecords/{fhirRecordId}"
    calls:
      - from: POST /api/FhirRecords
        to: FS.FhirRecord
        method: AddFhirRecordAsync
      - from: GET /api/FhirRecords
        to: FS.FhirRecord
        method: RetrieveAllFhirRecordsAsync
      - from: "GET /api/FhirRecords/{fhirRecordId}"
        to: FS.FhirRecord
        method: RetrieveFhirRecordByIdAsync
      - from: PUT /api/FhirRecords
        to: FS.FhirRecord
        method: ModifyFhirRecordAsync
      - from: "DELETE /api/FhirRecords/{fhirRecordId}"
        to: FS.FhirRecord
        method: RemoveFhirRecordByIdAsync
  - id: MG.FhirRecordDifferences
    name: FhirRecordDifferencesController
    layer: exposer
    col: 4
    description: "RESTFulController over FhirRecordDifference, [Authorize(Roles = ManageRoles.AdministratorsAndUsers)] at class level with each verb widening that to a granular app role as well (FhirRecordDifferences.Read / Create / Update / Delete). Nothing here is [InvisibleApi] — the comparison screens read these rows and annotate them. The list endpoint is OData-enabled ([EnableQuery], PageSize 5000 in DEBUG and 50 otherwise) and returns the IQueryable straight from the foundation service, and the entity is registered in the host's EDM model so it is reachable on /odata as well as /api. Xeption types are mapped one-for-one onto RFC problem responses."
    methods:
      - POST /api/FhirRecordDifferences
      - GET /api/FhirRecordDifferences
      - "GET /api/FhirRecordDifferences/{fhirRecordDifferenceId}"
      - PUT /api/FhirRecordDifferences
      - "DELETE /api/FhirRecordDifferences/{fhirRecordDifferenceId}"
    calls:
      - from: POST /api/FhirRecordDifferences
        to: FS.FhirRecordDifference
        method: AddFhirRecordDifferenceAsync
      - from: GET /api/FhirRecordDifferences
        to: FS.FhirRecordDifference
        method: RetrieveAllFhirRecordDifferencesAsync
      - from: "GET /api/FhirRecordDifferences/{fhirRecordDifferenceId}"
        to: FS.FhirRecordDifference
        method: RetrieveFhirRecordDifferenceByIdAsync
      - from: PUT /api/FhirRecordDifferences
        to: FS.FhirRecordDifference
        method: ModifyFhirRecordDifferenceAsync
      - from: "DELETE /api/FhirRecordDifferences/{fhirRecordDifferenceId}"
        to: FS.FhirRecordDifference
        method: RemoveFhirRecordDifferenceByIdAsync
  - id: MG.Patients
    name: PatientsController
    layer: exposer
    col: 4
    description: "The operator-facing side of $getstructuredrecord — it exists so someone holding a consumer's credentials can see exactly what that consumer would receive without standing up a client. [Authorize(Roles = ManageRoles.AdministratorsAndUsers)] and deliberately not [InvisibleApi]: unlike the seed-and-tear-down verbs on the telemetry controllers, this endpoint is the feature. A POST although it reads, because an NHS number, a date of birth and client credentials do not belong in a query string that server logs and browser history keep. It answers Content(payload, \"text/plain\") rather than Ok(string) so a caller sending a strict Accept header is not handed the provider's payload serialised AS a JSON string, and returns the Api's own X-Correlation-Id on a header rather than in the body, so the page can send an operator on to the comparisons and metrics that same call produced."
    methods:
      - POST /api/Patients/getstructuredrecord
    calls:
      - from: POST /api/Patients/getstructuredrecord
        to: MG.PatientService
        method: GetStructuredRecordAsync
  - id: MG.PatientService
    name: PatientService
    layer: foundation
    col: 5
    description: "Two round trips through one broker: a client credentials token exchange against PatientConfiguration.AuthUrl, then the CareConnect $getstructuredrecord operation carrying that token. Credentials are resolved per request — each of the four fields falls back to its PatientConfiguration counterpart only when the caller leaves it blank, which is what lets the page prove one consumer's credentials without disturbing the configured ones. It builds the STU3 Parameters body itself and sends it as application/fhir+json; includeInactivePatients is always false because this is a diagnostic view of what a consumer would get. ILoggingBroker is its only other dependency and is used on the exception path only, so no edge is drawn for it."
    methods:
      - GetStructuredRecordAsync
    calls:
      - from: GetStructuredRecordAsync
        to: MG.HttpBroker
        method: PostFormUrlEncodedContentAsync
      - from: GetStructuredRecordAsync
        to: MG.HttpBroker
        method: PostJsonContentAsync
  - id: MG.HttpBroker
    name: HttpBroker
    layer: broker
    col: 6
    description: "A thin wrapper over HTTP, named for the transport rather than for either endpoint it is pointed at, so the same broker serves the token call and the structured record call — the urls are the caller's. Neither method parses the body: the token response and the FHIR bundle are the service's to read. A non-2xx throws HttpResponseException carrying the status code and the response body on a property rather than in the message or Exception.Data, because what an upstream says when it refuses is the most useful thing it says and can also name a patient. Registered as a typed client (AddHttpClient) with a 150 second timeout — longer than the Api endpoint's own 130 — and sends with HttpCompletionOption.ResponseHeadersRead so a large bundle is never buffered. Neither destination is drawn as a node, the way ConsumerAccessBroker's remote endpoint is not: both are urls from PatientConfiguration. GetStructuredRecordUrl is pointed at this solution's own Api host in every environment — the same POST /api/STU3/Patient/$getstructuredrecord a consumer would call — and AuthUrl at the Entra token endpoint that issues the bearer for it."
    methods:
      - PostFormUrlEncodedContentAsync
      - PostJsonContentAsync
    calls:
      - from: PostFormUrlEncodedContentAsync
        to: EXT.HttpClient
        method: SendAsync
      - from: PostJsonContentAsync
        to: EXT.HttpClient
        method: SendAsync
  - id: MG.Features
    name: FeaturesController
    layer: exposer
    col: 4
    description: "[Authorize]'d read of the Features array from IConfiguration."
    methods:
      - GET /api/Features
  - id: MG.Versions
    name: VersionsController
    layer: exposer
    col: 4
    description: "The release this portal is running, for the SPA's header: answers ApplicationVersion { CoreVersion } from LondonFhirService.Core's static CoreVersion.Value — the Core assembly version, which is the Version a release bumps in LondonFhirService.Core.csproj, so neither host carries a copy of its own that could fall behind. The Api host reports the same value on its root route. [Authorize(Roles = ManageRoles.AdministratorsAndUsers)] like the rest of this host, because the header only renders for a signed-in user. No injected dependencies, and CoreVersion is a static helper rather than a DI component, so nothing is drawn beneath it."
    methods:
      - GET /api/Versions
  - id: MG.FrontendConfigurations
    name: FrontendConfigurationsController
    layer: exposer
    col: 4
    description: "Anonymous endpoint the SPA calls before MSAL exists, to learn its clientId / authority / scopes."
    methods:
      - GET /api/FrontendConfigurations
