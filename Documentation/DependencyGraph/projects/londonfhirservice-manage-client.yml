# LondonFhirService.Manage.Client — components and flows
# Part of the solution dependency graph — see README.md in this folder.
# Data only: index.html fetches graph.yml, then each project file, and
# assembles them. Strings with special characters are double-quoted JSON.
#
# The SPA follows the same layering as the server: page -> view service ->
# foundation service -> API broker -> apiBroker (axios + MSAL) -> host
# endpoint. Page hooks (hooks/pages/use*Page.ts) are private helpers of the
# page that owns them, so their calls are attributed to the page.

project: manage-client
components:
  - id: MC.Bootstrap
    name: "main.tsx → MsalConfig.build"
    layer: exposer
    col: 0
    description: "The SPA bootstraps by fetching its own MSAL configuration from the Manage host, then instantiating MSAL and rendering App."
    methods:
      - MsalConfig.build
      - PublicClientApplication.initialize
    calls:
      - from: MsalConfig.build
        to: MC.FrontendConfigurationBroker
        method: GetFrontendConfigruationAsync
  - id: MC.FeatureSwitch
    name: FeatureSwitch
    layer: exposer
    col: 0
    description: "Renders its children only when the named feature is in the host's Features array."
    methods:
      - FeatureSwitch
    calls:
      - from: FeatureSwitch
        to: MC.FeatureService
        method: useGetAllFeatures
  - id: MC.Navbar
    name: NavbarComponent
    layer: exposer
    col: 0
    description: "The layout's top bar, rendered by root.tsx around every page. Modelled because it now has a service dependency, the way FeatureSwitch is; the rest of the layout (sidebar, footer) still has none. It shows the portal's release next to the title through its useApplicationVersion hook, whose call is attributed here as the page hooks' calls are attributed to their pages. The hook is a TanStack Query read with staleTime Infinity and retry false: the version only changes on a deployment, and a deployment reloads the page. A failure renders nothing rather than an error, because the header is not the place to report that a version could not be read."
    methods:
      - NavbarComponent
    calls:
      - from: NavbarComponent
        to: MC.VersionViewService
        method: retrieveVersionViewAsync
  - id: MC.AuditsPage
    name: AuditsPage
    layer: exposer
    col: 0
    description: "Route admin/audits. The paged, searchable audit list. Its useAuditsPage hook holds the page number, the debounced search term and the abort signal, and asks the view service for one assembled page view rather than composing rows itself."
    methods:
      - admin/audits
    calls:
      - from: admin/audits
        to: MC.AuditViewService
        method: retrieveAuditPageViewAsync
  - id: MC.AuditDetailPage
    name: AuditDetailPage
    layer: exposer
    col: 0
    description: "Route admin/audits/:auditId. One audit entry in full, including the payload the entry carries."
    methods:
      - "admin/audits/:auditId"
    calls:
      - from: "admin/audits/:auditId"
        to: MC.AuditViewService
        method: retrieveAuditDetailViewAsync
  - id: MC.MetricsPage
    name: MetricsPage
    layer: exposer
    col: 0
    description: "Route admin/metrics. The span list plus the averages panel above it. The list is driven by one MetricFilter the view service creates — correlation id, user id and a date range, debounced before it is applied. The panel has two tiles: All requests, a separate query the database averages over the whole table and which ignores the search, and Matching the search, which buildLoadedMetricAveragesView works out from the rows already loaded — so its count is always the requests-loaded count beside the list, and it costs no request of its own. A part-typed correlation id is held back rather than sent, because the API would reject it, which is why isSearchableCorrelationId is asked here. The Export to CSV button hands the applied filter to exportMetricsAsync, so the file holds every request the search found rather than the pages scrolled so far; it is disabled while a search is settling or a correlation id is incomplete."
    methods:
      - admin/metrics
    calls:
      - from: admin/metrics
        to: MC.MetricViewService
        method: exportMetricsAsync
      - from: admin/metrics
        to: MC.MetricViewService
        method: createMetricFilter
      - from: admin/metrics
        to: MC.MetricViewService
        method: retrieveMetricPageViewAsync
      - from: admin/metrics
        to: MC.MetricViewService
        method: retrieveAllMetricAveragesViewAsync
      - from: admin/metrics
        to: MC.MetricViewService
        method: buildLoadedMetricAveragesView
      - from: admin/metrics
        to: MC.MetricViewService
        method: isSearchableCorrelationId
  - id: MC.MetricDetailPage
    name: MetricDetailPage
    layer: exposer
    col: 0
    description: "Route admin/metrics/:correlationId. Every span recorded under one correlation id, assembled into the request's span tree."
    methods:
      - "admin/metrics/:correlationId"
    calls:
      - from: "admin/metrics/:correlationId"
        to: MC.MetricViewService
        method: retrieveMetricCorrelationViewAsync
  - id: MC.ComparisonsPage
    name: ComparisonsPage
    layer: exposer
    col: 0
    description: "Route admin/comparisons. The paged list of FHIR record differences, with an unresolved-only filter, above a second list of pending comparisons — records that have landed but have not been compared yet. The two come from different entities: a difference row is the result, a pending FhirRecord is the queue, so the page asks the view service for each separately."
    methods:
      - admin/comparisons
    calls:
      - from: admin/comparisons
        to: MC.ComparisonViewService
        method: retrieveComparisonPageViewAsync
      - from: admin/comparisons
        to: MC.ComparisonViewService
        method: retrievePendingComparisonViewsAsync
  - id: MC.ComparisonDetailPage
    name: ComparisonDetailPage
    layer: exposer
    col: 0
    description: "Route admin/comparisons/:fhirRecordDifferenceId. One comparison side by side with its per-item diff list. Individual diffs can be marked acceptable, which is a read-modify-write of the difference row rather than an endpoint of its own."
    methods:
      - "admin/comparisons/:fhirRecordDifferenceId"
    calls:
      - from: "admin/comparisons/:fhirRecordDifferenceId"
        to: MC.ComparisonViewService
        method: retrieveComparisonDetailViewAsync
      - from: "admin/comparisons/:fhirRecordDifferenceId"
        to: MC.ComparisonViewService
        method: createComparisonFormValues
      - from: "admin/comparisons/:fhirRecordDifferenceId"
        to: MC.ComparisonViewService
        method: setDiffAcceptanceAsync
      - from: "admin/comparisons/:fhirRecordDifferenceId"
        to: MC.ComparisonViewService
        method: updateComparisonAsync
  - id: MC.ProvidersPage
    name: ProvidersPage
    layer: exposer
    col: 0
    description: "Route admin/providers. The provider list. Filtering is done in the browser over the already-fetched list rather than as another request, because the table is small and operator-managed."
    methods:
      - admin/providers
    calls:
      - from: admin/providers
        to: MC.ProviderViewService
        method: retrieveProviderListItemViewsAsync
      - from: admin/providers
        to: MC.ProviderViewService
        method: filterProviderListItemViews
  - id: MC.ProviderAddPage
    name: ProviderAddPage
    layer: exposer
    col: 0
    description: "Route admin/providers/new. The create form; the view service owns both the empty form values and the mapping back to a registration."
    methods:
      - admin/providers/new
    calls:
      - from: admin/providers/new
        to: MC.ProviderViewService
        method: createProviderFormValues
      - from: admin/providers/new
        to: MC.ProviderViewService
        method: addProviderAsync
  - id: MC.ProviderDetailPage
    name: ProviderDetailPage
    layer: exposer
    col: 0
    description: "Route admin/providers/:providerId. View, edit and delete one provider. The write verbs beneath this page narrow to ManageAdmin on the host, so a ManageUsers caller can open it and still be refused the save."
    methods:
      - "admin/providers/:providerId"
    calls:
      - from: "admin/providers/:providerId"
        to: MC.ProviderViewService
        method: retrieveProviderDetailViewAsync
      - from: "admin/providers/:providerId"
        to: MC.ProviderViewService
        method: createProviderFormValues
      - from: "admin/providers/:providerId"
        to: MC.ProviderViewService
        method: updateProviderAsync
      - from: "admin/providers/:providerId"
        to: MC.ProviderViewService
        method: removeProviderAsync
  - id: MC.StructuredRecordPage
    name: StructuredRecordPage
    layer: exposer
    col: 0
    description: "Route admin/structured-record. Calls $getstructuredrecord live with credentials the operator types, and renders the payload that comes back. Its useStructuredRecordPage hook owns the form values, the AbortController that abandons an in-flight lookup, and the split of a failure into per-field messages and a banner — the view service says which errors belong under an input by reporting only the form-backed fields as fieldErrors."
    methods:
      - admin/structured-record
    calls:
      - from: admin/structured-record
        to: MC.StructuredRecordViewService
        method: createStructuredRecordFormValues
      - from: admin/structured-record
        to: MC.StructuredRecordViewService
        method: retrieveStructuredRecordViewAsync
  - id: MC.AuditViewService
    name: auditViewService
    layer: view
    col: 1
    description: "Turns audit rows into the page and detail views the audit screens render — paging metadata, list items and the expanded entry."
    methods:
      - retrieveAuditPageViewAsync
      - retrieveAuditDetailViewAsync
    calls:
      - from: retrieveAuditPageViewAsync
        to: MC.AuditService
        method: retrieveAuditsAsync
      - from: retrieveAuditDetailViewAsync
        to: MC.AuditService
        method: retrieveAuditByIdAsync
  - id: MC.MetricViewService
    name: metricViewService
    layer: view
    col: 1
    description: "The busiest view service, and the only one with two foundation dependencies. Builds the MetricFilter the metrics screens share, builds the averages panel's two tiles — All requests from the one aggregate query the database answers, Matching the search computed in the browser from the list rows already loaded, calling no service at all — decides whether a search term is a complete correlation id, and assembles the correlation view's span tree. The page view fetches the ProviderRequests spans for just the rows on that page in one call, so each row can show its proxy overhead without a round trip per request. exportMetricsAsync fetches the server-built CSV and hands it to the file download service under a timestamped name, so two exports never collide in a downloads folder."
    methods:
      - createMetricFilter
      - isSearchableCorrelationId
      - retrieveMetricPageViewAsync
      - retrieveAllMetricAveragesViewAsync
      - buildLoadedMetricAveragesView
      - retrieveMetricCorrelationViewAsync
      - exportMetricsAsync
    calls:
      - from: retrieveMetricPageViewAsync
        to: MC.MetricService
        method: retrieveRequestMetricsAsync
      - from: retrieveMetricPageViewAsync
        to: MC.MetricService
        method: retrieveProviderRequestsMetricsByCorrelationIdsAsync
      - from: exportMetricsAsync
        to: MC.MetricService
        method: retrieveMetricExportAsync
      - from: exportMetricsAsync
        to: MC.FileDownloadService
        method: downloadFileAsync
      - from: retrieveAllMetricAveragesViewAsync
        to: MC.MetricService
        method: retrieveMetricAveragesAsync
      - from: retrieveMetricCorrelationViewAsync
        to: MC.MetricService
        method: retrieveMetricsByCorrelationIdAsync
  - id: MC.ComparisonViewService
    name: comparisonViewService
    layer: view
    col: 1
    description: "Assembles a comparison from a difference row and, for the detail view, both FHIR records behind it — fetched together with Promise.allSettled, so a comparison whose secondary record has since been removed is still worth seeing. Marking diffs acceptable and saving the form are both read-modify-write: the row is re-read first so a save cannot clobber a field the page never showed. retrievePendingComparisonViewsAsync reads the other side of the same screen — records that have landed but have not been compared yet — from the FHIR record queue rather than from difference rows."
    methods:
      - retrieveComparisonPageViewAsync
      - retrievePendingComparisonViewsAsync
      - retrieveComparisonDetailViewAsync
      - createComparisonFormValues
      - setDiffAcceptanceAsync
      - updateComparisonAsync
    calls:
      - from: retrieveComparisonPageViewAsync
        to: MC.FhirRecordDifferenceService
        method: retrieveFhirRecordDifferencesAsync
      - from: retrievePendingComparisonViewsAsync
        to: MC.FhirRecordService
        method: retrievePendingFhirRecordsAsync
      - from: retrieveComparisonDetailViewAsync
        to: MC.FhirRecordDifferenceService
        method: retrieveFhirRecordDifferenceByIdAsync
      - from: retrieveComparisonDetailViewAsync
        to: MC.FhirRecordService
        method: retrieveFhirRecordByIdAsync
      - from: setDiffAcceptanceAsync
        to: MC.FhirRecordDifferenceService
        method: retrieveFhirRecordDifferenceByIdAsync
      - from: setDiffAcceptanceAsync
        to: MC.FhirRecordDifferenceService
        method: modifyFhirRecordDifferenceAsync
      - from: updateComparisonAsync
        to: MC.FhirRecordDifferenceService
        method: retrieveFhirRecordDifferenceByIdAsync
      - from: updateComparisonAsync
        to: MC.FhirRecordDifferenceService
        method: modifyFhirRecordDifferenceAsync
  - id: MC.StructuredRecordViewService
    name: structuredRecordViewService
    layer: view
    col: 1
    description: "Owns the form's empty values (grant type pre-filled with client_credentials, because that is what every consumer of this endpoint uses) and turns one lookup into the view the page renders. It is also where a failure is sorted: the API names the field it rejected, and only the six fields the form actually shows are returned as fieldErrors — AuthUrl and GetStructuredRecordUrl are configuration, so a message about them has no input to sit under and goes to the banner instead. A PatientValidationException is rethrown untouched rather than wrapped, so someone who mistyped a date is not told to contact support."
    methods:
      - createStructuredRecordFormValues
      - retrieveStructuredRecordViewAsync
    calls:
      - from: retrieveStructuredRecordViewAsync
        to: MC.PatientService
        method: retrieveStructuredRecordAsync
  - id: MC.ProviderViewService
    name: providerViewService
    layer: view
    col: 1
    description: "Maps between provider rows and the list, detail and form views. Update re-reads the row before writing, so the save carries the fields the form never showed."
    methods:
      - retrieveProviderListItemViewsAsync
      - retrieveProviderDetailViewAsync
      - filterProviderListItemViews
      - createProviderFormValues
      - addProviderAsync
      - updateProviderAsync
      - removeProviderAsync
    calls:
      - from: retrieveProviderListItemViewsAsync
        to: MC.ProviderService
        method: retrieveAllProvidersAsync
      - from: retrieveProviderDetailViewAsync
        to: MC.ProviderService
        method: retrieveProviderByIdAsync
      - from: addProviderAsync
        to: MC.ProviderService
        method: addProviderAsync
      - from: updateProviderAsync
        to: MC.ProviderService
        method: retrieveProviderByIdAsync
      - from: updateProviderAsync
        to: MC.ProviderService
        method: modifyProviderAsync
      - from: removeProviderAsync
        to: MC.ProviderService
        method: removeProviderByIdAsync
  - id: MC.VersionViewService
    name: versionViewService
    layer: view
    col: 1
    description: "Turns the reported version into the text the header shows — the trimmed Core version prefixed with v — and wraps any failure beneath it in a VersionViewServiceException."
    methods:
      - retrieveVersionViewAsync
    calls:
      - from: retrieveVersionViewAsync
        to: MC.VersionService
        method: retrieveVersionAsync
  - id: MC.FeatureService
    name: featureService
    layer: foundation
    col: 2
    description: "TanStack Query wrapper (staleTime: Infinity) over the feature broker. The only foundation service exposed as a hook rather than a class — the feature list is read once and cached for the session."
    methods:
      - useGetAllFeatures
    calls:
      - from: useGetAllFeatures
        to: MC.FeatureBroker
        method: GetAllFeatureAsync
  - id: MC.AuditService
    name: auditService
    layer: foundation
    col: 2
    description: "Validates the query and localises the broker's exceptions before handing audit rows up. No write surface: the host's audit write verbs are [InvisibleApi], so the SPA reads only."
    methods:
      - retrieveAuditsAsync
      - retrieveAuditByIdAsync
    calls:
      - from: retrieveAuditsAsync
        to: MC.AuditApiBroker
        method: getAuditsAsync
      - from: retrieveAuditByIdAsync
        to: MC.AuditApiBroker
        method: getAuditByIdAsync
  - id: MC.MetricService
    name: metricService
    layer: foundation
    col: 2
    description: "Read-only, like the audit service and for the same reason. Three of the five verbs are different span queries rather than different entities: the request spans, the provider-request spans for a given set of correlation ids, and every span under one correlation id. An empty correlation id list returns nothing without a request, because an empty in list is not valid OData. retrieveMetricAveragesAsync returns the database's own per-type averages over the whole table and takes no input, so it has nothing to validate. The fifth, retrieveMetricExportAsync, validates the filter and returns the export as a Blob."
    methods:
      - retrieveRequestMetricsAsync
      - retrieveMetricAveragesAsync
      - retrieveProviderRequestsMetricsByCorrelationIdsAsync
      - retrieveMetricExportAsync
      - retrieveMetricsByCorrelationIdAsync
    calls:
      - from: retrieveRequestMetricsAsync
        to: MC.MetricApiBroker
        method: getRequestMetricsAsync
      - from: retrieveMetricAveragesAsync
        to: MC.MetricApiBroker
        method: getMetricAveragesAsync
      - from: retrieveProviderRequestsMetricsByCorrelationIdsAsync
        to: MC.MetricApiBroker
        method: getProviderRequestsMetricsByCorrelationIdsAsync
      - from: retrieveMetricExportAsync
        to: MC.MetricApiBroker
        method: getMetricExportAsync
      - from: retrieveMetricsByCorrelationIdAsync
        to: MC.MetricApiBroker
        method: getMetricsByCorrelationIdAsync
  - id: MC.ProviderService
    name: providerService
    layer: foundation
    col: 2
    description: "The SPA's only full CRUD foundation service — providers are operator-managed configuration, so unlike audits and metrics their write verbs are routable."
    methods:
      - retrieveAllProvidersAsync
      - retrieveProviderByIdAsync
      - addProviderAsync
      - modifyProviderAsync
      - removeProviderByIdAsync
    calls:
      - from: retrieveAllProvidersAsync
        to: MC.ProviderApiBroker
        method: getAllProvidersAsync
      - from: retrieveProviderByIdAsync
        to: MC.ProviderApiBroker
        method: getProviderByIdAsync
      - from: addProviderAsync
        to: MC.ProviderApiBroker
        method: postProviderAsync
      - from: modifyProviderAsync
        to: MC.ProviderApiBroker
        method: putProviderAsync
      - from: removeProviderByIdAsync
        to: MC.ProviderApiBroker
        method: deleteProviderByIdAsync

  - id: MC.FhirRecordDifferenceService
    name: fhirRecordDifferenceService
    layer: foundation
    col: 2
    description: "Read and update only. There is no create or delete path in the SPA: difference rows are written by the comparison worker, and the screens only annotate them."
    methods:
      - retrieveFhirRecordDifferencesAsync
      - retrieveFhirRecordDifferenceByIdAsync
      - modifyFhirRecordDifferenceAsync
    calls:
      - from: retrieveFhirRecordDifferencesAsync
        to: MC.FhirRecordDifferenceApiBroker
        method: getFhirRecordDifferencesAsync
      - from: retrieveFhirRecordDifferenceByIdAsync
        to: MC.FhirRecordDifferenceApiBroker
        method: getFhirRecordDifferenceByIdAsync
      - from: modifyFhirRecordDifferenceAsync
        to: MC.FhirRecordDifferenceApiBroker
        method: putFhirRecordDifferenceAsync
  - id: MC.FhirRecordService
    name: fhirRecordService
    layer: foundation
    col: 2
    description: "Read only, two verbs. The comparison detail view needs the records behind a difference row, and the comparisons list needs the records still waiting to be compared. Nothing in the SPA writes a FHIR record — they are written by the patient fan-out and settled by the comparison worker."
    methods:
      - retrieveFhirRecordByIdAsync
      - retrievePendingFhirRecordsAsync
    calls:
      - from: retrieveFhirRecordByIdAsync
        to: MC.FhirRecordApiBroker
        method: getFhirRecordByIdAsync
      - from: retrievePendingFhirRecordsAsync
        to: MC.FhirRecordApiBroker
        method: getPendingFhirRecordsAsync
  - id: MC.PatientService
    name: patientService
    layer: foundation
    col: 2
    description: "One verb, and the SPA's only call that is not CRUD over a stored entity — it asks the host to go and fetch a patient record live. Validates the request before it leaves and localises the broker's exceptions, the way every other foundation service here does."
    methods:
      - retrieveStructuredRecordAsync
    calls:
      - from: retrieveStructuredRecordAsync
        to: MC.PatientApiBroker
        method: postStructuredRecordAsync
  - id: MC.FileDownloadService
    name: fileDownloadService
    layer: foundation
    col: 2
    description: "Validates a file name and content, then hands them to the file download broker, localising its exceptions the way every other foundation service here does. The SPA's only foundation service that does not sit over an API broker."
    methods:
      - downloadFileAsync
    calls:
      - from: downloadFileAsync
        to: MC.FileDownloadBroker
        method: downloadFileAsync
  - id: MC.VersionService
    name: versionService
    layer: foundation
    col: 2
    description: "One read-only verb. Rejects a blank version with a VersionValidationException — it would render as a bare v in the header, which reads as a bug — and localises the broker's exceptions the way every other foundation service here does."
    methods:
      - retrieveVersionAsync
    calls:
      - from: retrieveVersionAsync
        to: MC.VersionApiBroker
        method: getVersionAsync
  - id: MC.AuditApiBroker
    name: auditApiBroker
    layer: broker
    col: 3
    description: "/api/audits. The list call builds an OData query string from an AuditQuery; the by-id call appends the encoded id."
    methods:
      - getAuditsAsync
      - getAuditByIdAsync
    calls:
      - from: getAuditsAsync
        to: MC.ApiBroker
        method: GetAsync
      - from: getAuditByIdAsync
        to: MC.ApiBroker
        method: GetAsync
  - id: MC.MetricApiBroker
    name: metricApiBroker
    layer: broker
    col: 3
    description: "/api/metrics. Four of the five verbs are GETs against the list endpoint with different OData queries — there is no by-id call, because a metric is only ever interesting alongside the other spans of its request. getProviderRequestsMetricsByCorrelationIdsAsync is one of them: the ProviderRequests spans for a page's correlation ids in a single in-list query. getMetricAveragesAsync is another, and the only one that returns no spans: an OData $apply groupby over Type with a count and an average of DurationMs, so the database averages the whole table rather than the SPA averaging a sample. A span type with no rows is absent from the answer and reads as no average rather than zero. getMetricExportAsync is the exception: a GET to /api/metrics/exports with the filter as plain query parameters, read through GetBlobAsync because the response is a CSV file rather than JSON."
    methods:
      - getRequestMetricsAsync
      - getMetricAveragesAsync
      - getProviderRequestsMetricsByCorrelationIdsAsync
      - getMetricExportAsync
      - getMetricsByCorrelationIdAsync
    calls:
      - from: getRequestMetricsAsync
        to: MC.ApiBroker
        method: GetAsync
      - from: getMetricAveragesAsync
        to: MC.ApiBroker
        method: GetAsync
      - from: getProviderRequestsMetricsByCorrelationIdsAsync
        to: MC.ApiBroker
        method: GetAsync
      - from: getMetricExportAsync
        to: MC.ApiBroker
        method: GetBlobAsync
      - from: getMetricsByCorrelationIdAsync
        to: MC.ApiBroker
        method: GetAsync
  - id: MC.ProviderApiBroker
    name: providerApiBroker
    layer: broker
    col: 3
    description: "/api/providers, the only SPA broker with write verbs."
    methods:
      - getAllProvidersAsync
      - getProviderByIdAsync
      - postProviderAsync
      - putProviderAsync
      - deleteProviderByIdAsync
    calls:
      - from: getAllProvidersAsync
        to: MC.ApiBroker
        method: GetAsync
      - from: getProviderByIdAsync
        to: MC.ApiBroker
        method: GetAsync
      - from: postProviderAsync
        to: MC.ApiBroker
        method: PostAsync
      - from: putProviderAsync
        to: MC.ApiBroker
        method: PutAsync
      - from: deleteProviderByIdAsync
        to: MC.ApiBroker
        method: DeleteAsync
  - id: MC.FhirRecordDifferenceApiBroker
    name: fhirRecordDifferenceApiBroker
    layer: broker
    col: 3
    description: "/api/fhirrecorddifferences."
    methods:
      - getFhirRecordDifferencesAsync
      - getFhirRecordDifferenceByIdAsync
      - putFhirRecordDifferenceAsync
    calls:
      - from: getFhirRecordDifferencesAsync
        to: MC.ApiBroker
        method: GetAsync
      - from: getFhirRecordDifferenceByIdAsync
        to: MC.ApiBroker
        method: GetAsync
      - from: putFhirRecordDifferenceAsync
        to: MC.ApiBroker
        method: PutAsync
  - id: MC.FhirRecordApiBroker
    name: fhirRecordApiBroker
    layer: broker
    col: 3
    description: "/api/fhirrecords. The by-id call appends the encoded id; the pending call is an OData query over the list endpoint built by fhirRecordApiBroker.queries. A response that is not an array is thrown rather than coerced to an empty list — \"the queue is empty\" and \"I cannot read this\" look identical on screen and mean opposite things."
    methods:
      - getFhirRecordByIdAsync
      - getPendingFhirRecordsAsync
    calls:
      - from: getFhirRecordByIdAsync
        to: MC.ApiBroker
        method: GetAsync
      - from: getPendingFhirRecordsAsync
        to: MC.ApiBroker
        method: GetAsync
  - id: MC.PatientApiBroker
    name: patientApiBroker
    layer: broker
    col: 3
    description: "/api/patients/getstructuredrecord — the SPA's one POST that is not a create. It reads the payload as text and the correlation id off the X-Correlation-Id response header (lowercased by axios, absent on an older host, so empty rather than undefined), and keeps whatever the API said about a failure — the status, the problem detail and the per-field errors — so the view service can put a message under the input that caused it."
    methods:
      - postStructuredRecordAsync
    calls:
      - from: postStructuredRecordAsync
        to: MC.ApiBroker
        method: PostAsync
  - id: MC.VersionApiBroker
    name: versionApiBroker
    layer: broker
    col: 3
    description: "/api/versions. Reads the response defensively, as every broker here treats the API as an untyped boundary: a missing or non-string coreVersion becomes an empty string for the foundation service to reject."
    methods:
      - getVersionAsync
    calls:
      - from: getVersionAsync
        to: MC.ApiBroker
        method: GetAsync
  - id: MC.FileDownloadBroker
    name: fileDownloadBroker
    layer: broker
    col: 3
    description: "The browser is an external dependency like any other, and this is the one place that reaches for it to hand a file to the person using the page: an object URL over the Blob, a temporary anchor with download set, a click, and the URL revoked in a finally so the whole export is not held in memory for the life of the page. The browser APIs are not drawn as a node, the same way axios and MSAL behind apiBroker are not. The SPA's only broker that is not an API broker."
    methods:
      - downloadFileAsync
  - id: MC.FeatureBroker
    name: apiBroker.features
    layer: broker
    col: 3
    methods:
      - GetAllFeatureAsync
    calls:
      - from: GetAllFeatureAsync
        to: MC.ApiBroker
        method: GetAsync
  - id: MC.FrontendConfigurationBroker
    name: apiBroker.frontendConfiguration
    layer: broker
    col: 3
    description: "Calls axios directly rather than through ApiBroker — it runs before MSAL is configured, so there is no token to attach."
    methods:
      - GetFrontendConfigruationAsync
    calls:
      - from: GetFrontendConfigruationAsync
        to: MG.FrontendConfigurations
