        to: API.Dispatcher
        method: TryDispatch
      - from: QueueFhirRecordPersistenceAsync
        to: AuditAndMetricBroker
        method: LogMetricAsync
      - from: QueueFhirRecordPersistenceAsync
        to: IdentifierBroker
        method: GetIdentifierAsync
      - from: QueueFhirRecordPersistenceAsync
        to: DateTimeBroker
        method: GetCurrentDateTimeOffsetAsync
      - from: QueueFhirRecordPersistenceAsync
