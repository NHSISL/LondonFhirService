# LondonFhirService.Core — components and flows
# Part of the solution dependency graph — see README.md in this folder.
# Data only: index.html fetches graph.yml, then each project file, and
# assembles them. Strings with special characters are double-quoted JSON.

project: core
components:
  - id: StorageBroker
    name: StorageBroker
    layer: broker
    col: 8
    description: "Partial EF Core DbContext (derives from EFxceptions' EFxceptionsContext) with one partial per entity. Every method delegates to a private generic that calls STX.EFCore.Client's EFCoreClient. Registered both as a DbContextFactory and a scoped IStorageBroker; OnConfiguring reads the LondonFhirServiceConnectionString and enables HierarchyId. Per-entity method rows are generated from the entity config."
    methods:
      - InsertFhirRecordAsync
      - SelectAllFhirRecordsAsync
      - SelectFhirRecordByIdAsync
      - UpdateFhirRecordAsync
      - DeleteFhirRecordAsync
      - InsertFhirRecordDifferenceAsync
      - SelectAllFhirRecordDifferencesAsync
      - SelectFhirRecordDifferenceByIdAsync
      - UpdateFhirRecordDifferenceAsync
      - DeleteFhirRecordDifferenceAsync
      - InsertProviderAsync
      - SelectAllProvidersAsync
      - SelectProviderByIdAsync
      - UpdateProviderAsync
      - DeleteProviderAsync
      - BulkInsertAuditsAsync
      - InsertAuditAsync
      - SelectAllAuditsAsync
      - SelectAuditByIdAsync
      - UpdateAuditAsync
      - DeleteAuditAsync
    calls:
      - from: InsertFhirRecordAsync
        to: LIB.EFCoreClient
        method: InsertAsync
      - from: SelectAllFhirRecordsAsync
        to: LIB.EFCoreClient
        method: SelectAllAsync
      - from: SelectFhirRecordByIdAsync
        to: LIB.EFCoreClient
        method: SelectAsync
      - from: UpdateFhirRecordAsync
        to: LIB.EFCoreClient
        method: UpdateAsync
      - from: DeleteFhirRecordAsync
        to: LIB.EFCoreClient
        method: DeleteAsync
      - from: InsertFhirRecordDifferenceAsync
        to: LIB.EFCoreClient
        method: InsertAsync
      - from: SelectAllFhirRecordDifferencesAsync
        to: LIB.EFCoreClient
        method: SelectAllAsync
      - from: SelectFhirRecordDifferenceByIdAsync
        to: LIB.EFCoreClient
        method: SelectAsync
      - from: UpdateFhirRecordDifferenceAsync
        to: LIB.EFCoreClient
        method: UpdateAsync
      - from: DeleteFhirRecordDifferenceAsync
        to: LIB.EFCoreClient
        method: DeleteAsync
      - from: InsertProviderAsync
        to: LIB.EFCoreClient
        method: InsertAsync
      - from: SelectAllProvidersAsync
        to: LIB.EFCoreClient
        method: SelectAllAsync
      - from: SelectProviderByIdAsync
        to: LIB.EFCoreClient
        method: SelectAsync
      - from: UpdateProviderAsync
        to: LIB.EFCoreClient
        method: UpdateAsync
      - from: DeleteProviderAsync
        to: LIB.EFCoreClient
        method: DeleteAsync
      - from: BulkInsertAuditsAsync
        to: LIB.EFCoreClient
        method: BulkInsertAsync
      - from: InsertAuditAsync
        to: LIB.EFCoreClient
        method: InsertAsync
      - from: SelectAllAuditsAsync
        to: LIB.EFCoreClient
        method: SelectAllAsync
      - from: SelectAuditByIdAsync
        to: LIB.EFCoreClient
        method: SelectAsync
      - from: UpdateAuditAsync
        to: LIB.EFCoreClient
        method: UpdateAsync
      - from: DeleteAuditAsync
        to: LIB.EFCoreClient
        method: DeleteAsync
  - id: StorageBrokerFactory
    name: StorageBrokerFactory
    layer: broker
    col: 8
    description: "Wraps IDbContextFactory<StorageBroker>. AuditService and Stu3PatientService use it to get a short-lived, independently-disposed StorageBroker instead of the scoped one — they write from background/parallel work where the request-scoped context is unsafe."
    methods:
      - CreateStorageBrokerAsync
    calls:
      - from: CreateStorageBrokerAsync
        to: EXT.EFCore
        method: IDbContextFactory.CreateDbContextAsync
  - id: SecurityAuditBroker
    name: SecurityAuditBroker
    layer: broker
    col: 8
    description: "Stamps CreatedBy/CreatedDate/UpdatedBy/UpdatedDate (and DeletedBy/DeletedDate) using the SecurityConfigurations built in each host's AddBrokers. Delegates to ISL.Security.Client's Audits client."
    methods:
      - ApplyAddAuditValuesAsync
      - ApplyModifyAuditValuesAsync
      - ApplyRemoveAuditValuesAsync
      - EnsureAddAuditValuesRemainsUnchangedOnModifyAsync
      - GetUserIdAsync
    calls:
      - from: ApplyAddAuditValuesAsync
        to: LIB.SecurityClient
        method: Audits.ApplyAddAuditValuesAsync
      - from: ApplyModifyAuditValuesAsync
        to: LIB.SecurityClient
        method: Audits.ApplyModifyAuditValuesAsync
      - from: ApplyRemoveAuditValuesAsync
        to: LIB.SecurityClient
        method: Audits.ApplyRemoveAuditValuesAsync
      - from: EnsureAddAuditValuesRemainsUnchangedOnModifyAsync
        to: LIB.SecurityClient
        method: Audits.EnsureOtherAuditValuesRemainsUnchangedOnModifyAsync
      - from: GetUserIdAsync
        to: LIB.SecurityClient
        method: Audits.GetUserIdAsync
  - id: SecurityBroker
    name: SecurityBroker
    layer: broker
    col: 8
    description: "Reads the caller from the ClaimsPrincipal. Only GetCurrentUserAsync is consumed today (by Stu3PatientOrchestrationService, to build the ValidateAccessRequest). ValidateCaptchaAsync is stubbed to return true — the captcha providers are registered but not yet called."
    methods:
      - GetCurrentUserAsync
      - IsCurrentUserAuthenticatedAsync
      - IsInRoleAsync
      - HasClaimAsync
      - ValidateCaptchaAsync
      - GetIpAddressAsync
    calls:
      - from: GetCurrentUserAsync
        to: LIB.SecurityClient
        method: Users.GetUserAsync
      - from: IsCurrentUserAuthenticatedAsync
        to: LIB.SecurityClient
        method: Users.IsUserAuthenticatedAsync
      - from: IsInRoleAsync
        to: LIB.SecurityClient
        method: Users.IsUserInRoleAsync
      - from: HasClaimAsync
        to: LIB.SecurityClient
        method: Users.UserHasClaimAsync
  - id: AuditBroker
    name: AuditBroker
    layer: broker
    col: 8
    description: "The business-audit trail (persisted Audit rows), distinct from LoggingBroker's ILogger output. Every method funnels into AuditClient, which calls AuditService — so an audit write travels broker → client → foundation service → storage."
    methods:
      - BulkLogAsync
      - LogAsync
      - LogInformationAsync
      - LogWarningAsync
      - LogErrorAsync
      - LogCriticalAsync
    calls:
      - from: LogAsync
        to: AuditClient
        method: LogAuditAsync
      - from: LogInformationAsync
        to: AuditClient
        method: LogAuditAsync
      - from: LogWarningAsync
        to: AuditClient
        method: LogAuditAsync
      - from: LogErrorAsync
        to: AuditClient
        method: LogAuditAsync
      - from: LogCriticalAsync
        to: AuditClient
        method: LogAuditAsync
      - from: BulkLogAsync
        to: AuditClient
        method: BulkLogAuditsAsync
  - id: ConsumerAccessBroker
    name: ConsumerAccessBroker
    layer: broker
    col: 8
    description: "Posts a ValidateAccessRequest to a remote consumer-access endpoint with a DefaultAzureCredential bearer token and reads back a ConsumerAccess verdict. Registered in the API host (AddHttpClient) and consumed by ConsumerAccessService — this is now the whole access decision."
    methods:
      - CheckConsumerAccessAsync
    calls:
      - from: CheckConsumerAccessAsync
        to: EXT.TokenCredential
        method: GetTokenAsync
      - from: CheckConsumerAccessAsync
        to: EXT.HttpClient
        method: SendAsync
  - id: DateTimeBroker
    name: DateTimeBroker
    layer: broker
    col: 8
    utility: true
    methods:
      - GetCurrentDateTimeOffsetAsync
  - id: IdentifierBroker
    name: IdentifierBroker
    layer: broker
    col: 8
    utility: true
    methods:
      - GetIdentifierAsync
  - id: LoggingBroker
    name: LoggingBroker
    layer: broker
    col: 8
    utility: true
    description: "ILogger passthrough. Exception-path (TryCatch) logging is deliberately NOT drawn on this graph — only happy-path calls and denial logging."
    methods:
      - LogInformationAsync
      - LogTraceAsync
      - LogDebugAsync
      - LogWarningAsync
      - LogErrorAsync
      - LogCriticalAsync
    calls:
      - from: LogInformationAsync
        to: EXT.ILogger
        method: ILogger.LogInformation
      - from: LogTraceAsync
        to: EXT.ILogger
        method: ILogger.LogTrace
      - from: LogDebugAsync
        to: EXT.ILogger
        method: ILogger.LogDebug
      - from: LogWarningAsync
        to: EXT.ILogger
        method: ILogger.LogWarning
      - from: LogErrorAsync
        to: EXT.ILogger
        method: ILogger.LogError
      - from: LogCriticalAsync
        to: EXT.ILogger
        method: ILogger.LogCritical
