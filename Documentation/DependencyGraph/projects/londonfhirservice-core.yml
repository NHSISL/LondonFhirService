  - id: PR.ListEntryComparison
    name: ListEntryComparisonProcessingService
    layer: processing
    col: 6
    description: "Compares the entry count of two List resources and emits an entry-count-mismatch DiffItem when they differ. ILoggingBroker only, on the exception path."
    methods:
      - CompareListEntryCountsAsync
  - id: PR.Rule.ArrayOrder
    name: ArrayOrderIgnoreProcessingRule
    layer: processing
    col: 6
    description: "Sorts array members before comparison so ordering differences are not reported as diffs. Derives from JsonIgnoreProcessingRuleBase."
    methods:
      - ShouldIgnoreAsync
      - GetReplacementAsync
    calls:
      - from: GetReplacementAsync
        to: FS.JsonElement
        method: CreateArrayElement
      - from: GetReplacementAsync
        to: FS.JsonElement
        method: CreateObjectElement
  - id: PR.Rule.Guid
    name: GuidIgnoreProcessingRule
    layer: processing
    col: 6
    description: "Replaces GUID-shaped values with a constant so provider-minted identifiers do not diff. Derives from JsonIgnoreProcessingRuleBase."
    methods:
      - ShouldIgnoreAsync
      - GetReplacementAsync
    calls:
      - from: GetReplacementAsync
        to: FS.JsonElement
        method: CreateStringElement
  - id: PR.Rule.Id
    name: IdIgnoreProcessingRule
    layer: processing
    col: 6
    description: "Replaces resource `id` values with a constant. Derives from JsonIgnoreProcessingRuleBase."
    methods:
      - ShouldIgnoreAsync
      - GetReplacementAsync
    calls:
      - from: GetReplacementAsync
        to: FS.JsonElement
        method: CreateStringElement
  - id: PR.Rule.Meta
    name: MetaIgnoreProcessingRule
    layer: processing
    col: 6
    description: "Replaces `meta` blocks (versionId / lastUpdated) with a constant. Derives from JsonIgnoreProcessingRuleBase."
    methods:
      - ShouldIgnoreAsync
      - GetReplacementAsync
    calls:
      - from: GetReplacementAsync
        to: FS.JsonElement
        method: CreateStringElement
  - id: OR.Stu3FhirReconciliation
    name: Stu3FhirReconciliationService
    layer: orchestration
    col: 5
    description: "Placeholder reconciliation: returns the first non-empty bundle and throws NotFoundFhirReconciliationOrchestrationException when every provider came back empty. It takes only ILoggingBroker — no real merge across providers yet. Modelled as an orchestration: it sits alongside Stu3PatientOrchestrationService under the coordination service, and its exceptions are the FhirReconciliationOrchestration* family."
    methods:
      - ReconcileSerialisedAsync
  - id: OR.Stu3Patient
    name: Stu3PatientOrchestrationService
    layer: orchestration
    col: 5
    description: "Gates the request on access, then fans it out. GetStructuredRecordSerialisedAsync runs the access check first, reads the STU3 providers, keeps the active ones (IsActive plus the ActiveFrom/ActiveTo window) with the primary first, validates that exactly one primary exists, and returns a StructuredRecordsResponse for the coordination service to reconcile. CheckAccessPermissionsAsync honours AccessConfigurations.CheckAccessPermissions: off, it audits the skip and returns; on, it resolves the caller, builds a ValidateAccessRequest and asks ConsumerAccessService — not allowed writes an Access Forbidden audit carrying the returned reason codes and throws ForbiddenPatientOrchestrationException, allowed writes an Access Allowed audit naming the organisations that granted it. Both paths emit a metric span."
    methods:
      - GetStructuredRecordSerialisedAsync
      - CheckAccessPermissionsAsync
    calls:
      - from: GetStructuredRecordSerialisedAsync
        to: AuditAndMetricBroker
        method: LogInformationAsync
      - from: GetStructuredRecordSerialisedAsync
        to: AuditAndMetricBroker
        method: LogMetricAsync
      - from: GetStructuredRecordSerialisedAsync
        to: IdentifierBroker
        method: GetIdentifierAsync
      - from: GetStructuredRecordSerialisedAsync
        to: DateTimeBroker
        method: GetCurrentDateTimeOffsetAsync
      - from: GetStructuredRecordSerialisedAsync
        to: FS.Provider
        method: RetrieveAllProvidersAsync
      - from: GetStructuredRecordSerialisedAsync
        to: FS.Stu3Patient
        method: GetStructuredRecordSerialisedAsync
      - from: CheckAccessPermissionsAsync
        to: AuditAndMetricBroker
        method: LogInformationAsync
      - from: CheckAccessPermissionsAsync
        to: AuditAndMetricBroker
        method: RecordAuditAsync
      - from: CheckAccessPermissionsAsync
        to: AuditAndMetricBroker
        method: LogMetricAsync
      - from: CheckAccessPermissionsAsync
        to: SecurityBroker
        method: GetCurrentUserAsync
      - from: CheckAccessPermissionsAsync
        to: FS.ConsumerAccess
        method: CheckConsumerAccessAsync
      - from: CheckAccessPermissionsAsync
        to: IdentifierBroker
        method: GetIdentifierAsync
      - from: CheckAccessPermissionsAsync
        to: DateTimeBroker
        method: GetCurrentDateTimeOffsetAsync
  - id: OR.CompareQueue
    name: CompareQueueOrchestrationService
    layer: orchestration
    col: 5
    description: "The comparison queue. GetUnprocessedRecordAsync claims the oldest Pending secondary FhirRecord that has been settled for at least 5 minutes and pairs it with the primary record sharing its CorrelationId. The claim is a set-based statement in the database rather than a read-then-write, so two workers cannot both win the same row."
    methods:
      - GetUnprocessedRecordAsync
      - ChangeFhirRecordStatusAsync
      - PersistFhirRecordDifferencesAsync
    calls:
      - from: GetUnprocessedRecordAsync
        to: DateTimeBroker
        method: GetCurrentDateTimeOffsetAsync
      - from: GetUnprocessedRecordAsync
        to: FS.FhirRecord
        method: RetrieveAllFhirRecordsAsync
      - from: GetUnprocessedRecordAsync
        to: FS.FhirRecord
        method: TryClaimFhirRecordAsync
      - from: ChangeFhirRecordStatusAsync
        to: FS.FhirRecord
        method: RetrieveFhirRecordByIdAsync
      - from: ChangeFhirRecordStatusAsync
        to: FS.FhirRecord
        method: ModifyFhirRecordAsync
      - from: PersistFhirRecordDifferencesAsync
        to: FS.FhirRecordDifference
        method: AddFhirRecordDifferenceAsync
  - id: OR.Comparison
    name: ComparisonOrchestrationService
    layer: orchestration
    col: 5
    description: "Splits both bundles by resourceType, asks the matcher registry for a strategy per type, then walks matched pairs property by property after applying the ignore rules. Unmatched resources and types with no matcher become manual-review-required diffs. NOTE: MatchAsync / GetMatchKeyAsync are invoked on whichever IResourceMatcherService GetMatcherAsync returned, so those calls are not drawn as separate edges — follow GetMatcherAsync to see the candidates."
    methods:
      - CompareAsync
    calls:
      - from: CompareAsync
        to: PR.ResourceMatcher
        method: GetMatcherAsync
      - from: CompareAsync
        to: PR.ListEntryComparison
        method: CompareListEntryCountsAsync
      - from: CompareAsync
        to: PR.Rule.ArrayOrder
        method: ShouldIgnoreAsync
      - from: CompareAsync
        to: PR.Rule.ArrayOrder
        method: GetReplacementAsync
      - from: CompareAsync
        to: PR.Rule.Guid
        method: ShouldIgnoreAsync
      - from: CompareAsync
        to: PR.Rule.Guid
        method: GetReplacementAsync
      - from: CompareAsync
        to: PR.Rule.Id
        method: ShouldIgnoreAsync
      - from: CompareAsync
        to: PR.Rule.Id
        method: GetReplacementAsync
      - from: CompareAsync
        to: PR.Rule.Meta
        method: ShouldIgnoreAsync
      - from: CompareAsync
        to: PR.Rule.Meta
        method: GetReplacementAsync
      - from: CompareAsync
        to: FS.JsonElement
        method: CreateObjectElement
      - from: CompareAsync
        to: FS.JsonElement
        method: CreateArrayElement
  - id: CO.Stu3Patient
    name: Stu3PatientCoordinationService
    layer: coordination
    col: 4
    description: "Mints the correlation id for the whole request, audits each stage and times it as a metric span, delegates to the patient orchestration for the access-gated fan-out, then hands the per-provider bundles to the reconciliation orchestration, which returns the single serialised bundle the API hands back."
    methods:
      - GetStructuredRecordSerialisedAsync
    calls:
      - from: GetStructuredRecordSerialisedAsync
        to: IdentifierBroker
        method: GetIdentifierAsync
      - from: GetStructuredRecordSerialisedAsync
        to: DateTimeBroker
        method: GetCurrentDateTimeOffsetAsync
      - from: GetStructuredRecordSerialisedAsync
        to: AuditAndMetricBroker
        method: LogInformationAsync
      - from: GetStructuredRecordSerialisedAsync
        to: AuditAndMetricBroker
        method: LogMetricAsync
      - from: GetStructuredRecordSerialisedAsync
        to: OR.Stu3Patient
        method: GetStructuredRecordSerialisedAsync
      - from: GetStructuredRecordSerialisedAsync
        to: OR.Stu3FhirReconciliation
        method: ReconcileSerialisedAsync
  - id: CO.Comparison
    name: ComparisonCoordinationService
    layer: coordination
    col: 4
    description: "Drains the compare queue: claim a pair, compare, persist the FhirRecordDifference, then mark both records Completed. A pair with no primary record is marked Failed without comparison; a comparison that throws marks the secondary Failed and still completes the primary."
    methods:
      - ProcessFhirRecordsAsync
    calls:
      - from: ProcessFhirRecordsAsync
        to: OR.CompareQueue
        method: GetUnprocessedRecordAsync
      - from: ProcessFhirRecordsAsync
        to: OR.Comparison
        method: CompareAsync
      - from: ProcessFhirRecordsAsync
        to: IdentifierBroker
        method: GetIdentifierAsync
      - from: ProcessFhirRecordsAsync
        to: DateTimeBroker
        method: GetCurrentDateTimeOffsetAsync
      - from: ProcessFhirRecordsAsync
        to: OR.CompareQueue
        method: PersistFhirRecordDifferencesAsync
      - from: ProcessFhirRecordsAsync
        to: OR.CompareQueue
        method: ChangeFhirRecordStatusAsync
      - from: ProcessFhirRecordsAsync
        to: LoggingBroker
        method: LogWarningAsync
