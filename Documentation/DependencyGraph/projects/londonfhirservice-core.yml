      - from: ApplyModifyAuditValuesAsync
        to: LIB.SecurityClient
        method: Audits.ApplyModifyAuditValuesAsync
      - from: ApplyRemoveAuditValuesAsync
        to: LIB.SecurityClient
        method: Audits.ApplyRemoveAuditValuesAsync
      - from: EnsureAddAuditValuesRemainsUnchangedOnModifyAsync
        to: LIB.SecurityClient
        method: Audits.EnsureOtherAuditValuesRemainsUnchangedOnModifyAsync
      - from: GetUserIdAsync
        to: LIB.SecurityClient
        method: Audits.GetUserIdAsync
  - id: SecurityBroker
    name: SecurityBroker
    layer: broker
    col: 8
    description: "Reads the caller from the ClaimsPrincipal. Only GetCurrentUserAsync is consumed today (by Stu3PatientOrchestrationService, to build the ValidateAccessRequest). ValidateCaptchaAsync is stubbed to return true — the captcha providers are registered but not yet called."
    methods:
      - GetCurrentUserAsync
      - IsCurrentUserAuthenticatedAsync
      - IsInRoleAsync
      - HasClaimAsync
      - ValidateCaptchaAsync
      - GetIpAddressAsync
    calls:
      - from: GetCurrentUserAsync
        to: LIB.SecurityClient
        method: Users.GetUserAsync
      - from: IsCurrentUserAuthenticatedAsync
        to: LIB.SecurityClient
        method: Users.IsUserAuthenticatedAsync
      - from: IsInRoleAsync
        to: LIB.SecurityClient
        method: Users.IsUserInRoleAsync
      - from: HasClaimAsync
        to: LIB.SecurityClient
        method: Users.UserHasClaimAsync
  - id: AuditAndMetricBroker
    name: AuditAndMetricBroker
    layer: broker
    col: 8
    description: "The utility broker any service can call to record an audit entry or a metric span. Recording is service work, but every layer needs it and a broker may not call a service — so those services live in LondonFhirService.Clients.AuditAndMetrics and this broker wraps an external dependency, which is what a broker is for. It stamps nothing and constructs nothing: calling services build their own entries so the timestamp is the event time rather than the submit time. Not to be confused with AuditAndMetricStorageBroker beside it — this one runs up into the library, that one runs down into storage."
    methods:
      - LogInformationAsync
      - RecordAuditAsync
      - LogAuditAsync
      - BulkLogAuditsAsync
      - AddAuditAsync
      - RetrieveAllAuditsAsync
      - RetrieveAuditByIdAsync
