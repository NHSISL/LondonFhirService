  - id: AuditClient
    name: AuditClient
    layer: client
    col: 9
    description: "Sits between AuditBroker and AuditService — the one place in the solution where a broker calls back into a foundation service. The AuditService copy drawn to its left is that call."
    methods:
      - LogAuditAsync
      - BulkLogAuditsAsync
    calls:
      - from: LogAuditAsync
        to: FS.Audit
        method: "AddAuditAsync(auditType, title, message, …)"
      - from: BulkLogAuditsAsync
        to: FS.Audit
        method: BulkAddAuditsAsync
  - id: FS.ConsumerAccess
    name: ConsumerAccessService
    layer: foundation
    col: 7
    description: "A single passthrough onto ConsumerAccessBroker, consumed by Stu3PatientOrchestrationService.ValidateAccess. Validates the ValidateAccessRequest (ConsumerUserId, NhsNumber, CorrelationId) and forwards it with the caller's CancellationToken; its TryCatch maps HttpRequestException to a critical dependency exception and timeout / cancellation onto TimedOut- and CancelledConsumerAccessServiceException. It takes no storage broker — consumer access is no longer held locally."
    methods:
      - CheckConsumerAccessAsync
    calls:
      - from: CheckConsumerAccessAsync
        to: ConsumerAccessBroker
        method: CheckConsumerAccessAsync
  - id: FS.FhirRecord
    name: FhirRecordService
    layer: foundation
    col: 7
    description: "Foundation CRUD for FhirRecord. Add and Modify take security-audit stamps; Modify also re-reads storage and asks the security-audit broker to keep the original Created values; Remove is a straight delete after a read. Validations run inside the same TryCatch as the happy path, so their broker calls are drawn here too."
    methods:
      - AddFhirRecordAsync
      - RetrieveAllFhirRecordsAsync
      - RetrieveFhirRecordByIdAsync
      - ModifyFhirRecordAsync
      - RemoveFhirRecordByIdAsync
    calls:
      - from: AddFhirRecordAsync
        to: SecurityAuditBroker
        method: ApplyAddAuditValuesAsync
      - from: AddFhirRecordAsync
        to: SecurityAuditBroker
        method: GetUserIdAsync
      - from: AddFhirRecordAsync
        to: DateTimeBroker
        method: GetCurrentDateTimeOffsetAsync
      - from: AddFhirRecordAsync
        to: StorageBroker
        method: InsertFhirRecordAsync
      - from: RetrieveAllFhirRecordsAsync
        to: StorageBroker
        method: SelectAllFhirRecordsAsync
      - from: RetrieveFhirRecordByIdAsync
        to: StorageBroker
        method: SelectFhirRecordByIdAsync
      - from: ModifyFhirRecordAsync
        to: SecurityAuditBroker
        method: ApplyModifyAuditValuesAsync
      - from: ModifyFhirRecordAsync
        to: SecurityAuditBroker
        method: GetUserIdAsync
      - from: ModifyFhirRecordAsync
        to: DateTimeBroker
        method: GetCurrentDateTimeOffsetAsync
      - from: ModifyFhirRecordAsync
        to: StorageBroker
        method: SelectFhirRecordByIdAsync
      - from: ModifyFhirRecordAsync
        to: SecurityAuditBroker
        method: EnsureAddAuditValuesRemainsUnchangedOnModifyAsync
      - from: ModifyFhirRecordAsync
        to: StorageBroker
        method: UpdateFhirRecordAsync
      - from: RemoveFhirRecordByIdAsync
        to: StorageBroker
        method: SelectFhirRecordByIdAsync
      - from: RemoveFhirRecordByIdAsync
        to: StorageBroker
        method: DeleteFhirRecordAsync
  - id: FS.FhirRecordDifference
    name: FhirRecordDifferenceService
    layer: foundation
    col: 7
    description: "Foundation CRUD for FhirRecordDifference. Add and Modify take security-audit stamps; Modify also re-reads storage and asks the security-audit broker to keep the original Created values; Remove is a straight delete after a read. Validations run inside the same TryCatch as the happy path, so their broker calls are drawn here too."
