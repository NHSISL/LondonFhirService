# LondonFhirService.Api — components and flows
# Part of the solution dependency graph — see README.md in this folder.
# Data only: index.html fetches graph.yml, then each project file, and
# assembles them. Strings with special characters are double-quoted JSON.

project: api
components:
  - id: API.CorrelationMiddleware
    name: CorrelationMiddleware
    layer: exposer
    col: 4
    description: "First in the pipeline, ahead of authentication, authorization and the timeout policy. It settles the request's correlation id through CorrelationBroker and registers an OnStarting callback that writes it back as the X-Correlation-Id response header, so a response produced before any controller runs — a 401, a 403, a timeout, a malformed body — still carries the id its logs and metric spans were written under. The header is deferred rather than written inline so it lands on whatever response is eventually produced."
    methods:
      - InvokeAsync
    calls:
      - from: InvokeAsync
        to: CorrelationBroker
        method: GetCorrelationIdAsync
  - id: API.Patient
    name: PatientController (STU3)
    layer: exposer
    col: 4
    description: "The solution's headline endpoint. Accepts a FHIR Parameters body (custom FhirJson input/output formatters) and returns the reconciled STU3 bundle. Wrapped in a 130-second request-timeout policy. Reads the request correlation id the middleware has already promised the consumer and hands it to the coordination service, so the header and the audit trail carry the same id."
    methods:
      - POST /api/STU3/Patient/$getstructuredrecord
    calls:
      - from: POST /api/STU3/Patient/$getstructuredrecord
        to: CorrelationBroker
        method: GetCorrelationIdAsync
      - from: POST /api/STU3/Patient/$getstructuredrecord
        to: CO.Stu3Patient
        method: GetStructuredRecordSerialisedAsync
  - id: API.ComparisonWorker
    name: ComparisonWorker
    layer: exposer
    col: 4
    description: "BackgroundService registered by AddBackgroundWorkers. Creates a DI scope per pass, drains the compare queue, then sleeps ComparisonWorkerSettings.SleepIntervalSeconds. This is the only entry point into the comparison half of the solution."
    methods:
      - ExecuteAsync
    calls:
      - from: ExecuteAsync
        to: CO.Comparison
        method: ProcessFhirRecordsAsync
  - id: API.AuditAndMetricPurgeWorker
    name: AuditAndMetricPurgeWorker
    layer: exposer
    col: 4
    description: "Runs both retention sweeps on one cadence. The purges existed since audits and metrics were added but nothing ever called them, so the tables only ever grew — and the metrics one takes a row per span rather than per request. Each sweep is governed by its own half of AuditAndMetricsConfigurations (IsAuditPurgingAllowed / AuditRetentionPeriodInDays, IsMetricsPurgingAllowed / MetricsRetentionPeriodInDays); this worker only decides when to ask. Separate try blocks and a scope each, so a fault in one table's sweep cannot stop the other from ageing out. Both go through the foundation services rather than the brokers directly, so a failed sweep is reported in this application's exception types."
    methods:
      - ExecuteAsync
    calls:
      - from: ExecuteAsync
        to: FS.Audit
        method: PurgeAuditsOlderThanRetentionPeriodAsync
      - from: ExecuteAsync
        to: FS.Metric
        method: PurgeMetricsOlderThanRetentionPeriodAsync
  - id: API.Dispatcher
    name: AuditAndMetricsDispatcher
    layer: exposer
    col: 4
    description: "Where a deferred audit or metric write goes. The library defers these so recording does not add to the elapsed time of the work being recorded, but how that deferral happens is the host's business: a host with a lifecycle can queue the work and drain it under control, which a library with no lifecycle of its own cannot. Rejection is a return value rather than an exception, because the caller is recording telemetry and a full queue must not take down the requests it is trying to measure. Registered as a singleton and shared with the drain worker. Without a host-supplied dispatcher the library falls back to ThreadPoolDispatcher — one work item per write, unbounded, with nothing draining it on shutdown."
    methods:
      - TryDispatch
      - Complete
  - id: API.DispatchWorker
    name: AuditAndMetricsDispatchWorker
    layer: exposer
    col: 4
    description: "Drains the bounded dispatcher queue. StopAsync completes the queue and waits for in-flight writes, so a shutdown does not silently drop audits that were already accepted."
    methods:
      - ExecuteAsync
      - StopAsync
    calls:
      - from: ExecuteAsync
        to: API.Dispatcher
        method: Complete
  - id: API.Features
    name: FeaturesController
    layer: exposer
    col: 4
    description: "Reads the Features array straight from IConfiguration. No Core dependency."
    methods:
      - GET /api/Features
  - id: API.FrontendConfigurations
    name: FrontendConfigurationsController
    layer: exposer
    col: 4
    description: "Anonymous endpoint returning the FrontendConfiguration section (clientId / authority / scopes) so a SPA can build its MSAL config before sign-in. No Core dependency."
    methods:
      - GET /api/FrontendConfigurations
