    kind: internal
    file: projects/londonfhirservice-core.yml
  - id: pkg-security
    name: ISL.Security.Client
    kind: library
    file: projects/isl-security-client.yml
  - id: pkg-efcore
    name: STX.EFCore.Client
    kind: library
