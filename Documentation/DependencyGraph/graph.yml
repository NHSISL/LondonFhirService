# London FHIR Service — dependency graph manifest
# Part of the solution dependency graph — see README.md in this folder.
# Data only: index.html fetches graph.yml, then each project file, and
# assembles them. Strings with special characters are double-quoted JSON.
#
# Column map (components' col in the project files):
#   0 Manage.Client entry points   1 Manage.Client view services
#   2 Manage.Client brokers        3 host exposers (controllers/worker)
#   4 Core coordinations           5 Core orchestrations
#   6 Core processings             7 Core foundations
#   8 Core brokers                 9 Core clients
#   10 library exposers            11 library internals
#   12 far externals
# `projects` order controls layout bands; `roots` order controls the
# per-consumer view's tree order. A component flagged shared in its
# project file must appear in roots or its inbound edges are dropped.

solution: London FHIR Service
eventBroker: null
projects:
  - id: manage-client
    name: LondonFhirService.Manage.Client
    kind: internal
    file: projects/londonfhirservice-manage-client.yml
  - id: manage
    name: LondonFhirService.Manage
    kind: internal
    file: projects/londonfhirservice-manage.yml
  - id: api
