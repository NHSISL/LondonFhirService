    file: projects/londonfhirservice-providers-fhir-stu3.yml
  - id: ext-efcore
    name: EF Core / SQL Server
    kind: external
    file: projects/ef-core-sql-server.yml
  - id: ext-logging
    name: Microsoft.Extensions.Logging
    kind: external
    file: projects/microsoft-extensions-logging.yml
  - id: ext-azure
    name: Azure.Identity
    kind: external
    file: projects/azure-identity.yml
  - id: ext-http
    name: System.Net.Http
    kind: external
    file: projects/system-net-http.yml
  - id: ext-crypto
    name: System.Security.Cryptography
    kind: external
